# Render Blueprint — one web service (API + built frontend). The database is
# external (Neon); set DATABASE_URL in the dashboard.
# Deploy: push to GitHub, then "New +" → "Blueprint" and point Render at this file.
#
# The build installs devDependencies explicitly (`--include=dev`, inside `npm run
# build`): NODE_ENV=production makes npm skip them, and both the frontend build
# tool (vite) and the Prisma CLI live there — without it the build fails.
#
# `db:push` carries `--accept-data-loss`. Without it, `prisma db push` refuses to
# apply ANY change it considers destructive — including simply adding a unique
# index — and the deploy fails at build time with "Use the --accept-data-loss
# flag". The flag is what lets a schema change reach the deployed database.
# It does mean a future edit that drops a column drops that column's data, so
# check `npx prisma db push` locally (without the flag) before deploying a
# schema change and read what it says it will do.
#
# `db:seed` runs on every deploy. It is idempotent (upserts) and is what creates
# the one bootstrap admin account; skip it and the deployed app has no user that
# can log in. It also resets that admin's password to ADMIN_PASSWORD each deploy.
services:
  - type: web
    name: OnlineData
    runtime: node
    plan: free
    buildCommand: npm run build && npm run db:push && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Neon (external PostgreSQL). Paste the connection string in the Render
      # dashboard. Use Neon's DIRECT (non-pooled, no `-pooler` in the host)
      # string: `prisma db push` runs at build time and does not survive the
      # pgbouncer pooler. Required query parameters:
      #
      #   ?sslmode=require   Neon refuses unencrypted connections outright.
      #   &connect_timeout=20
      #       Neon's free tier suspends the compute after five idle minutes and
      #       has to cold-start on the next query. Prisma's default five-second
      #       connect timeout can expire during that wake-up, surfacing as a
      #       spurious "Can't reach database server" on the first request after
      #       a quiet spell — exactly the request a visitor arrives on.
      #   &connection_limit=5
      #       Prisma otherwise sizes its pool from the host's CPU count, which
      #       on a shared 0.1-CPU instance bears no relation to what this app
      #       needs and burns Neon's free connection allowance.
      #
      #   postgresql://USER:PASS@ep-xxx.REGION.aws.neon.tech/neondb?sslmode=require&connect_timeout=20&connection_limit=5
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"

      # ---- Bootstrap admin -------------------------------------------------
      # The only account seeding creates; every teacher/student is added from
      # inside the app. Set both in the dashboard before the first deploy.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ---- Grading ---------------------------------------------------------
      # Without GEMINI_API_KEY the platform still runs, but grading falls back to
      # a mock that scores by text length — fine for a smoke test, not for real
      # marking or a demo. Set the key in the dashboard.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Quota is counted per model. Once the newest model returns 429 the chain
      # is the only thing keeping grading off the length-based mock, so it ends
      # on an older, less contended model that still answers.
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-flash-latest,gemini-3.5-flash,gemini-2.5-flash
      # Each sample is one API call, and GEMINI_VERIFY adds one more: at 3 and
      # "true" a single submission costs FOUR calls. That is the accuracy this
      # platform is built around, but on a free API key it exhausts the daily
      # quota after a handful of submissions and every later one silently drops
      # to the mock grader. On a free key set GEMINI_SAMPLES to 1; keep 3 only
      # with billing enabled on the Google Cloud project behind the key.
      - key: GEMINI_SAMPLES
        value: "3"
      - key: GEMINI_VERIFY
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false   # optional secondary text-only grader

      # ---- Live Classroom (Agora RTC) ---------------------------------------
      # Without these, the rest of the platform still runs — only "Jonli
      # darslar" breaks, with a clear error when a token is requested. Get both
      # from a free agora.io project (Console → Project Management → your
      # project → enable "App Certificate"): App ID from the project list,
      # Primary Certificate from its "Config" button. Set both in the dashboard.
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_TOKEN_TTL
        value: "3600"

      # ---- Rules -----------------------------------------------------------
      - key: MAX_ATTEMPTS
        value: "3"

      # ---- Originality check -----------------------------------------------
      # Tuned down from the defaults for the free plan's 0.1 CPU. `BACKFILL`
      # re-reads and re-parses that many stored submission files on every check
      # to fingerprint work that predates the feature; at the default of 40 that
      # is minutes of parsing per submission on a tenth of a core. Detection
      # quality barely moves — the corpus still fills in, just over more
      # submissions.
      - key: PLAGIARISM_BACKFILL
        value: "10"
      - key: PLAGIARISM_POOL
        value: "100"

# No `databases:` block: PostgreSQL is hosted on Neon, not Render. Adding one
# back would create a second database AND overwrite DATABASE_URL with it.
